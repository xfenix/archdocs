replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  hosts:
    - host: never.example.com

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

persistence:
  enabled: false
  size: 40Gi

imagePullSecrets:
  - secretName: registry-credentials
