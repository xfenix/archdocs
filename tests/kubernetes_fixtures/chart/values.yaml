replicaCount: 3

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-example-com-tls
      hosts:
        - api.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    nvidia.com/gpu: 1
  limits:
    cpu: 500m
    memory: 512Mi
    nvidia.com/gpu: 1

envFrom:
  - configMapRef:
      name: app-config
  - secretRef:
      name: app-secrets

volumes:
  - name: tuning
    configMap:
      name: app-tuning

persistence:
  enabled: true
  size: 10Gi

nodeSelector: {}
tolerations: []
affinity: {}
