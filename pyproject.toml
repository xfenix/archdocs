[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archdocs"
version = "1.0.0"
description = "Package for automatic architecture schemas renderers. Includes FastAPI and Litestar integrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Both integrations are optional: the package itself needs neither fastapi nor litestar,
# it imports exactly the one the user binds it to.
[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
litestar = ["litestar>=2.0"]

[project.urls]
Repository = "https://github.com/xfenix/archdocs"
Coverage = "https://xfenix.github.io/archdocs/"

[dependency-groups]
dev = [
    "auto-typing-final>=1.0.4",
    "community-of-python-flake8-plugin>=0.6.0",
    "fastapi>=0.141.1",
    "flake8-pyproject>=1.2.4",
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "litestar>=2.24.0",
    "mypy>=2.3.0",
    "playwright>=1.62.0",
    "polyfactory>=2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "uvicorn>=0.52.0",
    "watchfiles>=1.2.0",
    "wemake-python-styleguide>=1.7.0",
]

# The wheel ships the package directory as a whole: `template.html` and `py.typed` are not
# data files next to the code but part of the package — without the template the import fails.
[tool.hatch.build.targets.wheel]
packages = ["archdocs"]

[tool.hatch.build.targets.sdist]
include = ["archdocs"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
exclude = ["tests/fastapi/src/*", "tests/litestar/src/*", "tests/showcase/src/*"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D1",
    "D203",
    "D213",
    "EM",
    "FA",
    "FBT",
    "G004",
    "ISC001",
    "TRY003",
]
external = ["WPS", "COP"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = []
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311"]
"scripts/*.py" = ["INP001"]

[tool.mypy]
strict = true
exclude = ["tests/fastapi/", "tests/litestar/", "tests/showcase/"]

[tool.flake8]
max-line-length = 120
exclude = ["tests/fastapi", "tests/litestar", "tests/showcase"]
# Every feature adds a couple of imports, a parser and a renderer to the registry in `mapping.py`.
max-imports = 30
# WPS202 counts the tests themselves as module members: a cap of seven functions per file caps
# the number of checks in a suite, not the complexity of the code they check.
# `factories.py` is a declaration of generated data: polyfactory binds a field to the method
# named after it, so the providers are nouns and there are as many of them as the model has
# fields — neither the verb rule nor the method cap can be met without breaking the binding.
per-file-ignores = ["tests/*.py:WPS218,WPS202", "tests/factories.py:WPS218,WPS202,WPS214,COP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=. --cov-report=term-missing"

[tool.coverage.run]
# The example applications are input for the parsers, not code under test: one exclusion list
# for all three, same as for ruff and mypy. Today only `tests/fastapi` reaches the report,
# because only it has an `__init__.py` — giving one to its neighbours must not drop coverage.
omit = ["tests/fastapi/*", "tests/litestar/*", "tests/showcase/*", "scripts/*"]
branch = true

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
fail_under = 100
