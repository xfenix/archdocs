[project]
name = "fastarch"
version = "1.0.0"
description = "Package for automatic architecture schemas renderers. Includes FastAPI and Litestar integrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
exclude = ["tests/fastapi/src/*", "tests/litestar/src/*"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "EM",
    "FBT",
    "TRY003",
    "D1",
    "D203",
    "D213",
    "G004",
    "FA",
    "COM812",
    "ISC001",
    "CPY001",
]
external = ["WPS", "COP"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = []
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311"]
"scripts/*.py" = ["INP001"]

[tool.mypy]
exclude = ["tests/fastapi/", "tests/litestar/"]

[tool.flake8]
max-line-length = 120
exclude = ["tests/fastapi", "tests/litestar"]
# Каждая фича добавляет в реестр mapping.py по паре импортов, парсер и рендерер.
max-imports = 30
per-file-ignores = ["tests/*.py:WPS218"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/fastapi/*", "scripts/*"]

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
[dependency-groups]
dev = [
    "auto-typing-final>=1.0.4",
    "community-of-python-flake8-plugin>=0.6.0",
    "fastapi>=0.141.1",
    "flake8-pyproject>=1.2.4",
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "litestar>=2.24.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "uvicorn>=0.52.0",
    "watchfiles>=1.2.0",
    "wemake-python-styleguide>=1.7.0",
]
