[project]
name = "fastarch"
version = "1.0.0"
description = "Package for automatic architecture schemas renderers. Includes FastAPI and Litestar integrations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115.11", "litestar>=2.15.1"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.format]
quote-style = "preserve"
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["TRY003", "D1", "D203", "D213", "G004"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = []
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311"]

[dependency-groups]
dev = ["pytest>=8.3.5"]
