name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  ci:
    uses: community-of-python/community-workflow/.github/workflows/preset.yml@main
    with:
      python-version: '["3.12","3.13"]'
    secrets: inherit

  lint2:
    uses: wemake-services/wemake-python-styleguide@1.1.0
