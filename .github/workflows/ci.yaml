name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_LATEST: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ env.PYTHON_LATEST }}
      - run: just install
      - run: just lint check

  test:
    name: ${{ matrix.os }}-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: just install
      - run: just test

  coverage:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ env.PYTHON_LATEST }}
      - run: just install
      - run: just coverage
      - run: just lines

      - name: Push badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json .github/badges/lines.json
          git diff --cached --quiet || {
            git commit -m "chore: обновление бейджей [skip ci]"
            git pull --rebase --autostash
            git push
          }

      # Включить сам pages пайплайн не может: создание сайта требует прав админа,
      # а `GITHUB_TOKEN` их не имеет. Поэтому спрашиваем состояние и не роняем CI,
      # пока pages не включили руками в Settings.
      - name: Check github pages
        id: pages
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")"
          [ "${status}" = "200" ] && enabled=true || enabled=false
          echo "enabled=${enabled}" >>"$GITHUB_OUTPUT"
          [ "${enabled}" = "true" ] || echo "::warning::Github pages выключен, отчёт покрытия уедет в артефакт запуска. Включить: Settings -> Pages -> Source: GitHub Actions, после чего вернуть ссылку бейджа покрытия в README на https://xfenix.github.io/fastarch/."

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmlcov
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
        id: deployment

      - if: steps.pages.outputs.enabled != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov
