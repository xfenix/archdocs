name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
        with:
          python-version: '3.13'
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check --diff .
      - run: uv run mypy fastarch tests/test_http_api_parser_methods.py tests/fastapi/tests/test_architecture_route.py
      - run: uv run pytest
